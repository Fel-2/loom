name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release
      - name: unit tests
        run: cargo test --release
      - name: clippy
        run: cargo clippy --all-targets

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tools used by the suites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git-lfs python3 sqlite3
      - name: build
        run: cargo build --release
      - name: seed a throwaway instance
        run: ./scripts/make-test-bundle.sh
      - name: start it
        run: |
          BUNDLE=$(find dist -maxdepth 1 -type d -name 'loom-project-*' | head -1)
          [ -d "$BUNDLE" ] || { echo "no bundle directory under dist/"; exit 1; }
          echo "BUNDLE=$PWD/$BUNDLE" >> "$GITHUB_ENV"
          cp -a "$BUNDLE/test-data" data-run
          LOOM_DATA="$PWD/data-run" LOOM_ADDR=127.0.0.1:3917 LOOM_SSH_ADDR=127.0.0.1:2917 \
            LOOM_URL=http://127.0.0.1:3917 LOOM_SSH_HOST=127.0.0.1:2917 \
            "$BUNDLE/loom" serve >serve.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:3917/healthz >/dev/null && exit 0; sleep 0.5; done
          echo "server did not come up"; cat serve.log; exit 1
      - name: integration suites
        env:
          LOOM: ${{ env.BUNDLE }}/loom
          LOOM_DATA: ${{ github.workspace }}/data-run
          LOOM_TEST_URL: http://127.0.0.1:3917
          LOOM_TEST_SSH_PORT: "2917"
          KEYS: ${{ env.BUNDLE }}/test-keys
        run: |
          set -e
          for suite in smoke m3 m4 m5 m6 m7 m8 m9 m10; do
            echo "== $suite"
            ./tests/$suite.sh
          done
      - name: server log on failure
        if: failure()
        run: tail -50 serve.log

  footprint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release
      - name: footprint guard
        run: ./bench/guard.sh target/release/loom

  dist-aarch64:
    runs-on: ubuntu-latest
    needs: build
    # Cross-compiling 340 crates under QEMU takes 30-60 minutes, so it only runs
    # for a release tag or a manual dispatch, never on every push.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: aarch64 static tarball
        run: |
          PODMAN=docker ARCH=aarch64 ./scripts/dist.sh
          file dist/loom-*-linux-aarch64/loom | grep -q 'aarch64'
          tar -tzf dist/loom-*-linux-aarch64.tar.gz | grep -q 'deploy/install.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: loom-aarch64
          path: dist/loom-*-linux-aarch64.tar.gz
